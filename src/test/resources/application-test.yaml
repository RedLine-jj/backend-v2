spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  batch:
    jdbc:
      initialize-schema: embedded
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 1s
      timeout: 1s

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktMjU2LWJpdHM=
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

crawler:
  modeman:
    base-url: https://test-modeman.example.com
  neststore:
    base-url: https://test-neststore.example.com
  semibasement:
    base-url: https://test-semibasement.example.com

groq:
  api-key: test-api-key
  prompt: "후보 모델 목록: {candidates}\n크롤링 상품명: {product}"
