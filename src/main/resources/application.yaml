server:
  port: 8081

spring:
  application:
    name: jj
  profiles:
    default: local

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true

  batch:
    job:
      # 여러 크롤링 Job은 BatchController/BatchScheduler가 직접 실행한다.
      # true로 바꾸면 앱 시작 시 자동 실행 대상 Job 이름을 지정해야 한다.
      enabled: false
    jdbc:
      initialize-schema: embedded

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.redline.jj: DEBUG

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

crawler:
  modeman:
    base-url: https://mode-man.com
    categories:
      - category-no: 858
        model-type: DENIM_PANTS
      - category-no: 263
        model-type: DENIM_JACKET
  neststore:
    base-url: https://neststore.co.kr
    categories:
      - category-no: 34
        model-type: DENIM_PANTS
      - category-no: 230
        model-type: DENIM_JACKET
  semibasement:
    base-url: https://semibasement.com
    categories:
      - category-no: 89
        model-type: DENIM_PANTS
      - category-no: 93
        model-type: DENIM_JACKET

groq:
  api-key: ${GROQ_API_KEY}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
  model: llama-3.1-8b-instant
  confidence-threshold: 85.0
  prompt: "다음 상품이 기존 DB의 어떤 모델과 매칭되는지 알려주세요. 브랜드: {brandHint}, 상품명: {siteModelName}. JSON 형식으로 응답: {\"brandName\": \"<string>\", \"modelName\": \"<string>\", \"confidence\": <0-100>}"
